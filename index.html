<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17151d" />
    <title>Mikan · Desktop Companion</title>
    <!-- This tiny, inline screen paints before Vite/React finish booting the second WebView. -->
    <style>
      html.mikan-settings-loading,
      html.mikan-settings-loading body { background: #1d2228 !important; }
      html.mikan-settings-loading #root { opacity: 0; }
      html.mikan-settings-ready #root { opacity: 1; transition: opacity 180ms ease; }
      #settings-startup { display: none; }
      html.mikan-settings-loading #settings-startup {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 15px; background: #1d2228; color: #ecf0f1;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        transition: opacity 220ms ease;
      }
      html.mikan-settings-ready #settings-startup { opacity: 0; pointer-events: none; }
      .settings-startup-spinner {
        box-sizing: border-box; width: 38px; height: 38px; border-radius: 50%;
        border: 3px solid #44505b; border-top-color: #a2ced2;
        animation: mikan-settings-spin 850ms linear infinite;
      }
      .settings-startup-title { font-size: 16px; font-weight: 650; letter-spacing: .035em; }
      .settings-startup-subtitle { font-size: 12px; color: #aab6be; }
      @keyframes mikan-settings-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .settings-startup-spinner { animation: none; border-color: #a2ced2; }
        #settings-startup, html.mikan-settings-ready #root { transition: none; }
      }
    </style>
    <script>
      if (new URLSearchParams(window.location.search).get("settings") === "1") {
        document.documentElement.classList.add("mikan-settings-loading");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="settings-startup" role="status" aria-label="Loading Mikan Control Center">
      <div class="settings-startup-spinner" aria-hidden="true"></div>
      <div class="settings-startup-title">Mikan Control Center</div>
      <div class="settings-startup-subtitle">Opening your settings…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
