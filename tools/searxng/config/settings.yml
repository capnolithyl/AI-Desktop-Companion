# Temporary single-provider isolation for live Brain Lab research testing.
# Yahoo was the only verified relevant engine for all three Nov 17 release probes.
# Other upstream engines returned unrelated pages or rate-limit/access errors.
# This is not a permanent redundancy strategy; reassess after live testing.
use_default_settings:
  engines:
    keep_only:
      - yahoo

engines:
  - name: yahoo
    disabled: false

general:
  instance_name: "Mikan Search"
  debug: false

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  # This value is replaced by the generated SEARXNG_SECRET from .env.
  secret_key: "local-placeholder-overridden-by-env"
  limiter: false
  image_proxy: false
