# Private single-PC instance; retain upstream defaults except consistently failing engines.
# The Nov 15-16 live tests saw repeated CAPTCHA from DuckDuckGo and timeouts
# from Wikidata. Keep Brave + Google CSE, the two confirmed working providers.
# Bing and Qwant are fallback engines to evaluate on the user's own connection.
use_default_settings:
  engines:
    remove:
      - duckduckgo
      - wikidata

engines:
  - name: bing
    disabled: false
  - name: qwant
    disabled: false

general:
  instance_name: "Mikan Search"
  debug: false

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  # This value is replaced by the generated SEARXNG_SECRET from .env.
  secret_key: "local-placeholder-overridden-by-env"
  limiter: false
  image_proxy: false
