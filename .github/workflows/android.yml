name: Android Pocket APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/android.yml'
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React dependencies
        run: npm install --no-audit --no-fund
      - name: Test conversational memory intent
        run: node --experimental-strip-types --test src/mobile/memory-intent.test.mjs
      - name: Build shared React mobile frontend
        run: npm run build:mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Verify APK is installable beside the original
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='dev.capnolithyl.mikan.pocket.preview'"
      - uses: actions/upload-artifact@v4
        with:
          name: mikan-pocket-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
