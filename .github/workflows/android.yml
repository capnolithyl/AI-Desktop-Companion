name: Android Pocket APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/android.yml'
      - '.github/scripts/setup-android-signing.py'
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/android.yml'
      - '.github/scripts/setup-android-signing.py'

jobs:
  build:
    # Public fork PRs must never get access to the owner's signing secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React dependencies
        run: npm install --no-audit --no-fund
      - name: Test conversational memory intent
        run: node --experimental-strip-types --test src/mobile/*.test.mjs src/research-routing.test.mjs
      - name: Build shared React mobile frontend
        run: npm run build:mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare persistent private signing
        env:
          MIKAN_ANDROID_SIGNING_BUNDLE: ${{ secrets.MIKAN_ANDROID_SIGNING_BUNDLE }}
        run: |
          if [ -z "$MIKAN_ANDROID_SIGNING_BUNDLE" ]; then
            echo '::warning::Missing MIKAN_ANDROID_SIGNING_BUNDLE. Compiling and testing only, without publishing a disposable-key APK.'
            echo 'MIKAN_SIGNING_READY=false' >> "$GITHUB_ENV"
          else
            python3 .github/scripts/setup-android-signing.py
            echo 'MIKAN_SIGNING_READY=true' >> "$GITHUB_ENV"
          fi
      - name: Build and test Android APK
        working-directory: android
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Verify permanent package and signing certificate
        if: env.MIKAN_SIGNING_READY == 'true'
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='dev.capnolithyl.mikan.pocket'"
          # Fingerprints are public; printing this digest diagnoses a mismatched
          # signing secret without ever exposing the private keystore.
          CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
          ACTUAL="$(printf '%s\n' "$CERTS" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d '\r')"
          EXPECTED="f6879570f13b54e2d2f3cc3b32246a72c48e8023ec2b76088c57629fa4e5d609"
          echo "Built APK signer SHA-256: $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate does not match pinned private key"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: env.MIKAN_SIGNING_READY == 'true'
        with:
          name: mikan-pocket-signed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
