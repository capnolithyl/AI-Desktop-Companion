name: Mikan Launcher APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/mikan-launcher-v01']
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  pull_request:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare persistent signing
        env:
          MIKAN_ANDROID_SIGNING_BUNDLE: ${{ secrets.MIKAN_ANDROID_SIGNING_BUNDLE }}
        run: python3 .github/scripts/setup-android-signing.py
      - name: Test quick search ranking
        run: |
          mkdir -p /tmp/mikan-quick-search-tests
          javac -d /tmp/mikan-quick-search-tests launcher/app/src/main/java/dev/capnolithyl/mikan/launcher/QuickAppRank.java launcher/tests/QuickAppRankTest.java
          java -cp /tmp/mikan-quick-search-tests dev.capnolithyl.mikan.launcher.QuickAppRankTest
      - name: Test home slot model
        run: |
          mkdir -p /tmp/mikan-home-tests
          javac -d /tmp/mikan-home-tests launcher/app/src/main/java/dev/capnolithyl/mikan/launcher/HomeSlots.java launcher/tests/HomeSlotsTest.java
          java -cp /tmp/mikan-home-tests dev.capnolithyl.mikan.launcher.HomeSlotsTest
      - name: Test mixed grid model
        run: |
          mkdir -p /tmp/mikan-grid-tests
          javac -d /tmp/mikan-grid-tests launcher/app/src/main/java/dev/capnolithyl/mikan/launcher/MixedLayout.java launcher/tests/MixedLayoutTest.java
          java -cp /tmp/mikan-grid-tests dev.capnolithyl.mikan.launcher.MixedLayoutTest
      - name: Test local tasks and due dates
        run: |
          mkdir -p /tmp/mikan-task-tests
          javac -d /tmp/mikan-task-tests launcher/app/src/main/java/dev/capnolithyl/mikan/launcher/LocalTasks.java launcher/tests/LocalTasksTest.java
          java -cp /tmp/mikan-task-tests dev.capnolithyl.mikan.launcher.LocalTasksTest
      - name: Test drawer preferences and alphabetical index
        run: |
          mkdir -p /tmp/mikan-drawer-tests
          javac -d /tmp/mikan-drawer-tests launcher/app/src/main/java/dev/capnolithyl/mikan/launcher/DrawerData.java launcher/tests/DrawerDataTest.java
          java -cp /tmp/mikan-drawer-tests dev.capnolithyl.mikan.launcher.DrawerDataTest
      - name: Test drawer section rows and index wave
        run: |
          mkdir -p /tmp/mikan-section-tests
          javac -d /tmp/mikan-section-tests launcher/app/src/main/java/dev/capnolithyl/mikan/launcher/DrawerRows.java launcher/app/src/main/java/dev/capnolithyl/mikan/launcher/IndexWave.java launcher/tests/DrawerRowsTest.java
          java -cp /tmp/mikan-section-tests dev.capnolithyl.mikan.launcher.DrawerRowsTest
      - name: Test expression rules and bundled assets
        run: |
          mkdir -p /tmp/mikan-expression-tests
          javac -d /tmp/mikan-expression-tests launcher/app/src/main/java/dev/capnolithyl/mikan/launcher/MikanExpression.java launcher/tests/MikanExpressionTest.java
          java -cp /tmp/mikan-expression-tests dev.capnolithyl.mikan.launcher.MikanExpressionTest
          python3 - <<'PY'
          from pathlib import Path
          root = Path("launcher/app/src/main/assets/portraits/expressions")
          for name in ("default", "pouty", "sleepy", "surprised", "excited", "concerned", "smug", "freezing"):
              data = (root / (name + ".webp")).read_bytes()
              assert len(data) > 20 and data[:4] == b"RIFF" and data[8:12] == b"WEBP", name
              print(name, len(data), "bytes")
          for name in ("cozy_christmas_cocoa_with_mikan.png", "cozy_halloween_witch_catgirl_cocoa.png", "mikan_s_cozy_easter_portrait.png", "mikan_s_cozy_fourth_of_july_celebration.png", "mikan_s_cozy_new_year_celebration.png", "mikan_s_cozy_st._patrick_s_day_mug.png", "mikan_s_cozy_thanksgiving_gathering.png", "mikan_s_heartfelt_valentine_gift.png"):
              data = (root / name).read_bytes()
              assert data[:8] == bytes.fromhex("89504e470d0a1a0a") and data[12:16] == b"IHDR", name
              width = int.from_bytes(data[16:20], "big")
              height = int.from_bytes(data[20:24], "big")
              assert width * 3 == height * 4, (name, width, height)
              print(name, width, height, len(data), "bytes")
          PY
      - name: Test local personality rules and rotation
        run: |
          mkdir -p /tmp/mikan-personality-tests
          javac -d /tmp/mikan-personality-tests launcher/app/src/main/java/dev/capnolithyl/mikan/launcher/MikanExpression.java launcher/app/src/main/java/dev/capnolithyl/mikan/launcher/MikanPersonality.java launcher/app/src/main/java/dev/capnolithyl/mikan/launcher/MikanHoliday.java launcher/tests/MikanPersonalityTest.java
          java -cp /tmp/mikan-personality-tests dev.capnolithyl.mikan.launcher.MikanPersonalityTest
      - name: Test NAS health contract
        run: |
          mkdir -p /tmp/mikan-health-tests
          javac -d /tmp/mikan-health-tests launcher/app/src/main/java/dev/capnolithyl/mikan/launcher/MikanExpression.java launcher/app/src/main/java/dev/capnolithyl/mikan/launcher/MikanHealth.java launcher/tests/MikanHealthTest.java
          java -cp /tmp/mikan-health-tests dev.capnolithyl.mikan.launcher.MikanHealthTest
      - name: Compile launcher
        working-directory: launcher
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify and name APK
        run: |
          APK=launcher/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='dev.capnolithyl.mikan.launcher'"
          CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
          echo "$CERTS" | grep -i 'certificate SHA-256 digest: f6879570f13b54e2d2f3cc3b32246a72c48e8023ec2b76088c57629fa4e5d609'
          cp "$APK" Mikan-Launcher.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > launcher-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mikan-Launcher
          path: |
            Mikan-Launcher.apk
            launcher-version.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/mikan-launcher-v01')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Mikan-Launcher
      - name: Publish versioned launcher preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          CODE="$(grep -o "versionCode='[0-9]*'" launcher-version.txt | head -n1 | cut -d"'" -f2)"
          VERSION="$(grep -o "versionName='[0-9.]*'" launcher-version.txt | head -n1 | cut -d"'" -f2)"
          test -n "$CODE" && test -n "$VERSION"
          TAG="launcher-build-$CODE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; increment versionCode for the next update."
          else
            gh release create "$TAG" Mikan-Launcher.apk --target "$SOURCE_SHA" --title "Mikan Launcher v$VERSION" --notes "Signed experimental Android launcher APK, build $CODE." --prerelease --latest=false
          fi
