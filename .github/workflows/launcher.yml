name: Mikan Launcher APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/mikan-launcher-v01']
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  pull_request:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare persistent signing
        env:
          MIKAN_ANDROID_SIGNING_BUNDLE: ${{ secrets.MIKAN_ANDROID_SIGNING_BUNDLE }}
        run: python3 .github/scripts/setup-android-signing.py
      - name: Compile launcher
        working-directory: launcher
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify and name APK
        run: |
          APK=launcher/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='dev.capnolithyl.mikan.launcher'"
          CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
          echo "$CERTS" | grep -i 'certificate SHA-256 digest: f6879570f13b54e2d2f3cc3b32246a72c48e8023ec2b76088c57629fa4e5d609'
          cp "$APK" Mikan-Launcher.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > launcher-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mikan-Launcher
          path: |
            Mikan-Launcher.apk
            launcher-version.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/mikan-launcher-v01')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Mikan-Launcher
      - name: Publish versioned launcher preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          CODE="$(grep -o "versionCode='[0-9]*'" launcher-version.txt | head -n1 | cut -d"'" -f2)"
          VERSION="$(grep -o "versionName='[0-9.]*'" launcher-version.txt | head -n1 | cut -d"'" -f2)"
          test -n "$CODE" && test -n "$VERSION"
          TAG="launcher-build-$CODE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; increment versionCode for the next update."
          else
            gh release create "$TAG" Mikan-Launcher.apk --target "$SOURCE_SHA" --title "Mikan Launcher v$VERSION" --notes "Signed experimental Android launcher APK, build $CODE." --prerelease --latest=false
          fi
