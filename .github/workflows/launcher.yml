name: Mikan Launcher APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/mikan-launcher-v01']
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  pull_request:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare persistent signing
        env:
          MIKAN_ANDROID_SIGNING_BUNDLE: ${{ secrets.MIKAN_ANDROID_SIGNING_BUNDLE }}
        run: python3 .github/scripts/setup-android-signing.py
      - name: Compile launcher
        working-directory: launcher
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify and name APK
        run: |
          APK=launcher/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='dev.capnolithyl.mikan.launcher'"
          CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
          echo "$CERTS" | grep -i 'certificate SHA-256 digest: f6879570f13b54e2d2f3cc3b32246a72c48e8023ec2b76088c57629fa4e5d609'
          cp "$APK" Mikan-Launcher-v0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mikan-Launcher-v0.1
          path: Mikan-Launcher-v0.1.apk
          if-no-files-found: error
          retention-days: 30
