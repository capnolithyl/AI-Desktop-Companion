name: Brain reliability checks

on:
  push:
    branches: [feature/p0-brain-evaluation-harness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: Research contracts and UI typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Brain Lab and research contracts
        run: npm run test:brain
      - name: Typecheck and build frontend
        run: npm run build

  rust:
    name: Rust research and native compilation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Test native research code
        working-directory: src-tauri
        run: cargo test --lib
