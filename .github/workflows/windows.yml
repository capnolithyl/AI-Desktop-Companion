name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate icons
        run: npm run icons
      - name: Typecheck and build UI
        run: npm run build
      - name: Test debug-log export
        run: npm run test:debug
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test local voice reference API
        run: python -m unittest discover -s tools/tts -p "test_*.py"
      - name: Test Rust research intent and source handling
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build NSIS installer
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: mikan-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
