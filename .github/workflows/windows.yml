name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test local Mem0 adapter (mock SDK, no Ollama needed)
        run: python -m unittest discover -s advanced_memory/tests -v
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate icons
        run: npm run icons
      - name: Typecheck and build UI
        run: npm run build
      - name: Test shared desktop and Pocket research policy
        run: node --experimental-strip-types --test src/research-routing.test.mjs src/research-context.test.mjs src/runtime-context.test.mjs src/conversation-engine.test.mjs src/evidence-verification.test.mjs src/memory-ranking.test.mjs src/memory-retrieval.test.mjs src/reasoning-mode.test.mjs src/unified-planner.test.mjs src/preferred-sources.test.mjs src/memory-import.test.mjs src/communication-preferences.test.mjs src/character-canon-routing.test.mjs src/memory-outcome.test.mjs src/interest-context.test.mjs src/personal-grounding.test.mjs src/interest-import.test.mjs src/memory-budget.test.mjs src/session-memory.test.mjs src/archive-memory.test.mjs src/self-knowledge.test.mjs src/screen-vision.test.mjs src/live-vision.test.mjs src/capture-region.test.mjs src/chat-attachments.test.mjs src/desktop-turn-routing.test.mjs src/turn-execution-policy.test.mjs src/notion-knowledge.test.mjs src/notion-reading.test.mjs
      - name: Test Brain Lab scenarios, scoring and desktop layout
        run: npm run test:brain
      - name: Check optional local-model evaluation script syntax
        run: node --check scripts/eval-local.mjs
      - name: Verify self-knowledge matches release and native commands
        run: node --experimental-strip-types scripts/check-self-knowledge.mjs
      - name: Validate private development supervisor syntax
        run: node --check scripts/remote-dev-supervisor.mjs
      - name: Test local remote browser relay, dev supervisor and authentication
        run: npm run test:server
      - name: Test debug-log export
        run: npm run test:debug
      - name: Test local voice reference API
        run: python -m unittest discover -s tools/tts -p "test_*.py"
      - name: Validate Pocket setup PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/setup-pocket-tts.ps1").Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { $parseErrors | Out-String | Write-Error; exit 1 }
      - name: Test Rust research intent and source handling
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build NSIS installer
        run: npm run tauri -- build
      - name: Verify installer version and clean silent install
        shell: pwsh
        run: scripts/check-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: mikan-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
